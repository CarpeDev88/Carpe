name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test AI gateway
        run: cd backend && npm ci && npm test
      - name: Test local guidance
        run: gradle testDebugUnitTest
      - name: Build debug APK
        env:
          CARPE_AI_ENDPOINT: ${{ vars.CARPE_AI_ENDPOINT }}
        run: |
          if [ -z "$CARPE_AI_ENDPOINT" ]; then
            echo "::warning::CARPE_AI_ENDPOINT is unset. The APK needs a service URL entered in Me before cloud AI can work."
            echo "### Cloud AI not configured for this APK" >> "$GITHUB_STEP_SUMMARY"
            echo "Enter an HTTPS service URL in Me, or set the CARPE_AI_ENDPOINT repository variable and rebuild." >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! "$CARPE_AI_ENDPOINT" =~ ^https://[^/]+/v1/ask$ ]]; then
            echo "::error::CARPE_AI_ENDPOINT must be an HTTPS URL ending in /v1/ask"
            exit 1
          fi
          gradle assembleDebug -PCARPE_AI_ENDPOINT="$CARPE_AI_ENDPOINT"
      - name: Enable Android emulator acceleration
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            python3 scripts/smoke_onboarding.py
      - name: Save emulator screenshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: carpe-emulator-screenshot
          path: carpe-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: carpe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
