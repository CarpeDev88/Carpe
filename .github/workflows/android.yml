name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          CARPE_AI_ENDPOINT: ${{ vars.CARPE_AI_ENDPOINT }}
        run: |
          if [ -z "$CARPE_AI_ENDPOINT" ]; then
            echo "::warning::CARPE_AI_ENDPOINT is unset. The APK needs a service URL entered in Me before cloud AI can work."
            echo "### Cloud AI not configured for this APK" >> "$GITHUB_STEP_SUMMARY"
            echo "Enter an HTTPS service URL in Me, or set the CARPE_AI_ENDPOINT repository variable and rebuild." >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! "$CARPE_AI_ENDPOINT" =~ ^https://[^/]+/v1/ask$ ]]; then
            echo "::error::CARPE_AI_ENDPOINT must be an HTTPS URL ending in /v1/ask"
            exit 1
          fi
          gradle assembleDebug -PCARPE_AI_ENDPOINT="$CARPE_AI_ENDPOINT"
      - uses: actions/upload-artifact@v4
        with:
          name: carpe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
