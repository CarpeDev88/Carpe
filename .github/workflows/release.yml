name: Publish signed Android update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing configuration
        id: signing
        env:
          CARPE_SIGNING_KEYSTORE_BASE64: ${{ secrets.CARPE_SIGNING_KEYSTORE_BASE64 }}
          CARPE_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.CARPE_SIGNING_KEYSTORE_PASSWORD }}
          CARPE_SIGNING_KEY_ALIAS: ${{ secrets.CARPE_SIGNING_KEY_ALIAS }}
          CARPE_SIGNING_KEY_PASSWORD: ${{ secrets.CARPE_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$CARPE_SIGNING_KEYSTORE_BASE64" || -z "$CARPE_SIGNING_KEYSTORE_PASSWORD" || -z "$CARPE_SIGNING_KEY_ALIAS" || -z "$CARPE_SIGNING_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release skipped. Configure the four CARPE_SIGNING_* Actions secrets to enable in-app updates."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore private signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          CARPE_SIGNING_KEYSTORE_BASE64: ${{ secrets.CARPE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CARPE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carpe-release.jks"
          test -s "$RUNNER_TEMP/carpe-release.jks"
      - name: Test and build signed release
        if: steps.signing.outputs.configured == 'true'
        env:
          CARPE_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/carpe-release.jks
          CARPE_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.CARPE_SIGNING_KEYSTORE_PASSWORD }}
          CARPE_SIGNING_KEY_ALIAS: ${{ secrets.CARPE_SIGNING_KEY_ALIAS }}
          CARPE_SIGNING_KEY_PASSWORD: ${{ secrets.CARPE_SIGNING_KEY_PASSWORD }}
          CARPE_AI_ENDPOINT: ${{ vars.CARPE_AI_ENDPOINT }}
        run: |
          gradle testDebugUnitTest assembleRelease -PCARPE_AI_ENDPOINT="$CARPE_AI_ENDPOINT"
      - name: Prepare release APK and checksum
        if: steps.signing.outputs.configured == 'true'
        id: package
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          APK_NAME="CARPE-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease for CARPE update checks
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: CARPE v${{ steps.package.outputs.version }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
